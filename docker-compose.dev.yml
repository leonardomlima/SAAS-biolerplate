services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_db
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d saas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/saas_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8000:8000"]
    volumes: ["./backend:/app/backend"]
    command: bash -lc "cd backend && poetry run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: bash -lc "cd backend && poetry run celery -A app.background.tasks.celery_app worker -l info"
    env_file: .env
    depends_on: [backend]
    volumes: ["./backend:/app/backend"]
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: bash -lc "cd backend && poetry run celery -A app.background.tasks.celery_app beat -l info"
    env_file: .env
    depends_on: [backend]
    volumes: ["./backend:/app/backend"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    ports: ["5173:5173"]
    depends_on: [backend]
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
